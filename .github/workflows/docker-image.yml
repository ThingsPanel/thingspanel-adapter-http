# 工作流名称
name: Docker Image Build
# 触发方式:
# - Release触发: 当创建或更新 Release 时自动触发构建
# - 手动触发: 可以通过 GitHub Actions 页面手动触发
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to build, for example v1.0.0"
        required: false
      source_ref:
        description: "Reviewed source commit for a manual rebuild"
        required: false
# 构建任务
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 检出代码
      - name: 检出代码
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || inputs.source_ref || github.ref }}

      - name: Verify build source
        env:
          EXPECTED_SOURCE: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          actual=$(git rev-parse HEAD)
          echo "Building source commit $actual"
          if [ -n "$EXPECTED_SOURCE" ]; then test "$actual" = "$EXPECTED_SOURCE"; fi
          echo "BUILD_SOURCE_SHA=$actual" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.9'
      - name: Verify HTTP command lifecycle
        run: go test ./internal/downlink ./internal/protocol ./internal/platform -count=1
      
      # 获取版本号
      - name: 获取版本号
        id: get_version
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ -n "$RELEASE_TAG" ]; then
            VERSION="$RELEASE_TAG"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo 'latest')
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          # 添加仓库名小写转换
          echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV
      
      # 登录各个镜像仓库
      - name: 登录镜像仓库
        run: |
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.repository_owner }} --password-stdin
          echo "${{ secrets.IMAGE_PASS }}" | docker login registry.cn-hangzhou.aliyuncs.com -u ${{ secrets.IMAGE_USER }} --password-stdin
      
      # 设置 Docker Buildx
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # 构建并推送到 DockerHub 和 GitHub
      - name: 构建并推送到 GitHub/DockerHub
        id: image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.managed
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.revision=${{ env.BUILD_SOURCE_SHA }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: |
            thingspanel/thingspanel-adapter-http:${{ env.VERSION }}
            ghcr.io/${{ env.OWNER_LC }}/thingspanel-adapter-http:${{ env.VERSION }}
            registry.cn-hangzhou.aliyuncs.com/thingspanel/thingspanel-adapter-http:${{ env.VERSION }}

      - name: Record candidate provenance
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          python3 - <<'PY'
          import os, json, hashlib
          from pathlib import Path
          manifest = {
            "source_repository": os.environ["GITHUB_REPOSITORY"],
            "source_sha": os.environ["BUILD_SOURCE_SHA"],
            "workflow_sha": os.environ["GITHUB_SHA"],
            "workflow_run": os.environ["GITHUB_RUN_ID"],
            "image_digest": os.environ["IMAGE_DIGEST"],
            "tag": os.environ["VERSION"],
            "dockerfile_sha256": hashlib.sha256(Path("Dockerfile.managed").read_bytes()).hexdigest(),
            "tests": "go test ./internal/downlink ./internal/protocol ./internal/platform -count=1",
            "deployment_performed": False
          }
          Path("http-candidate-provenance.json").write_text(json.dumps(manifest, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: http-candidate-provenance
          path: http-candidate-provenance.json
