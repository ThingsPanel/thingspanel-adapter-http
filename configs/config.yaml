# configs/config.yaml
server:
  port: 8080
  http_port: 8081 # HTTP port (ThingsPanel callbacks + device uplink)
  heartbeatTimeout: 60

  # Device uplink HTTP auth (send header: X-Api-Key)
  http_api_key: "CHANGE_ME"

  # Auto-register device when device_number not found
  auto_register: true

platform:
  url: "http://47.104.235.67:19999"
  mqtt_broker: "mqtt://47.104.235.67:11883"
  mqtt_username: "root"
  mqtt_password: "root"
  service_identifier: "HTTP-DEMO"
  template_secret: "e43823f2-7a91-133b-13d1-612df60fbfdc"

log:
  level: "debug"
  filePath: "logs/app.log"
  enableFile: false
  maxSize: 100
  maxBackups: 3
  maxAge: 28
  compress: true
  
  device_log:
    enabled: true
    base_dir: "logs/devices"
    max_size: 10
    max_age: 30
    compress: true
