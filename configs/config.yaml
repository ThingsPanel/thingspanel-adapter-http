# configs/config.yaml
server:
  port: 19090 # Changed from 8080 to avoid Nginx conflict
  http_port: 8081 # HTTP port (ThingsPanel callbacks + device uplink)
  heartbeatTimeout: 60

  # Device uplink HTTP auth (send header: X-Api-Key)
  http_api_key: "CHANGE_ME"

  # Auto-register device when device_number not found
  auto_register: true

platform:
  url: "http://127.0.0.1:9999"      # Changed to localhost
  mqtt_broker: "tcp://127.0.0.1:1883" # Changed to localhost, tcp scheme
  mqtt_username: "root"
  mqtt_password: "root"
  service_identifier: "HTTP" # 服务标识符 
  # Using Template ID provided by user as the secret
  template_secret: "749fc9a7-643e-c48c-e52b-ea129444de3a"

log:
  level: "debug"
  filePath: "logs/app.log"
  enableFile: true # Enable file log to debug better
  maxSize: 100
  maxBackups: 3
  maxAge: 28
  compress: true
  
  device_log:
    enabled: true
    base_dir: "logs/devices"
    max_size: 10
    max_age: 30
    compress: true
